<head>
<meta charset="utf-8">

<link rel="icon" type="image/png" sizes="32x32" href="../brand/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../brand/apple-touch-icon.png">
<meta name="description" content="Aircraft management, simplified.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Valkyr360 by Hill Systems">
<meta property="og:title" content="Admin · Valkyr360 by Hill Systems">
<meta property="og:description" content="Aircraft management, simplified.">
<meta property="og:url" content="https://valkyr360.com/admin/">
<meta property="og:image" content="https://valkyr360.com/brand/og-image.png">
<meta property="og:image:secure_url" content="https://valkyr360.com/brand/og-image.png">
<meta property="og:image:type" content="image/png">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f4f6;color:#111827;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:28px 24px}
.v360{display:block;height:32px;width:auto;margin:0 0 6px}
.by{display:flex;align-items:center;gap:6px;margin:0 0 22px;font-size:12px;color:#6b7280}
.logo{display:block;height:16px;width:auto}
h1{font-size:20px;font-weight:600;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:500;margin:0 0 14px;color:#374151}
input{display:block;width:100%;margin-top:6px;padding:9px 10px;font:inherit;color:#111827;background:#fff;border:1px solid #d1d5db;border-radius:6px}
input:focus{outline:2px solid #2563eb;outline-offset:0;border-color:#2563eb}
input[aria-invalid=true]{border-color:#dc2626}
button{font:inherit;cursor:pointer}
.submit{width:100%;padding:10px;border:0;border-radius:6px;background:#111827;color:#fff;font-weight:600}
.submit:disabled{opacity:.6;cursor:wait}
.err{margin:0 0 14px;padding:8px 10px;border-radius:6px;background:#fef2f2;color:#991b1b;font-size:13px}
</style>
</head>
<body>
<main>
<section class="card" aria-labelledby="h">
  <img class="v360" src="../brand/valkyr360-logo-print.svg" alt="Valkyr360" width="117" height="32">
  <div class="by">by <img class="logo" src="../brand/hill-systems-logo-print.png" alt="Hill Systems" width="57" height="16"></div>
  <h1 id="h">Admin</h1>
  <form id="adminForm" novalidate>
    <div class="err" id="adminErr" role="alert" hidden></div>
    <label>Email<input name="email" type="email" autocomplete="username" inputmode="email" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="submit" id="adminBtn" type="submit">Sign in</button>
  </form>
</section>
</main>
<script src="../staff.js"></script>
<script src="login.js"></script>
</body>
</html>
